# Nginx for Windows configuration for tarp.cyngfps.com
server {
    listen 80;
    server_name tarp.cyngfps.com;

    # Allow large PNG templates & multi-logo uploads (up to 100MB)
    client_max_body_size 100M;

    # Increase timeouts for batch high-res PNG / ZIP rendering
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # Forward all traffic (UI + /api + /storage) to the Unified FastAPI server on port 8811
    location / {
        proxy_pass http://127.0.0.1:8811;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
